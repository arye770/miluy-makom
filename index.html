<style>
/* Layout: one column "יומן" — sticky top bar with month + tabs, content cards below; teacher screen is a month grid Sun–Fri */
:root{
  --bg:#EEF2F4; --card:#FFFFFF; --ink:#1B2A33; --muted:#5A6A74; --line:#D3DCE1;

  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --card:#16222A; --ink:#E3EBEF; --muted:#93A4AE; --line:#293842;

  --warn:#E5B04E; --warn-soft:#352A13; --sick:#8E5BB8; --sick-soft:#2D2238; --sick-ink:#FFFFFF; --off:#1C2930; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --card:#16222A; --ink:#E3EBEF; --muted:#93A4AE; --line:#293842;
  --accent:#4DB38C; --accent-ink:#06150F; --accent-soft:#183A2E;
  --marker:#E6BE45; --marker-ink:#231C00; --danger:#E27474; --danger-soft:#3A1E21;
  --warn:#E5B04E; --warn-soft:#352A13; --sick:#8E5BB8; --sick-soft:#2D2238; --sick-ink:#FFFFFF; --off:#1C2930; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}

.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--danger)}
button.btn{font:700 15px var(--f-body);border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
input,select{font:16px var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{width:70px;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}

tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}

.day input{width:100%;padding:4px 6px;text-align:center;font-weight:700}
.day .sk{font-size:11px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:1px 4px;cursor:pointer}
.day.sick .sk{color:var(--sick-ink);border-color:var(--sick-ink)}
.qday{min-height:0;gap:2px}.qday input{font-weight:700}.qday .meta b{color:var(--ink)}.qday.over{border-color:var(--danger);background:var(--danger-soft)}.qday.full{border-color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);display:block}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop input{display:none}
.auth{max-width:420px;margin:6vh auto 0;width:100%}
.auth form{display:flex;flex-direction:column;gap:12px}.auth input{width:100%}
.linkbtn{background:none;border:0;color:var(--accent);font:600 15px var(--f-body);cursor:pointer;padding:0;text-decoration:underline}
.who{display:flex;align-items:center;gap:8px;font-size:14px}.who button{background:transparent;color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent-ink) 40%,transparent);border-radius:8px;padding:4px 10px;font:600 14px var(--f-body);cursor:pointer}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--marker);color:var(--marker-ink);font-size:12px;font-weight:700;margin-inline-start:4px}
body.ro main input,body.ro main select{pointer-events:none;background:var(--off)}
body.ro [data-act]:not([data-act=export]):not([data-act=copy-teacher]):not([data-act=cancel]):not([data-act=logout]),body.ro .sk,body.ro [data-delhol],body.ro [data-delrange],body.ro .drop{display:none}
.qtag{display:inline-block;margin-top:3px;padding:1px 6px;border-radius:6px;background:var(--marker);color:var(--marker-ink);font-weight:700}
.who{font-size:11px;line-height:1.25;color:var(--sick);border-top:1px dashed var(--line);padding-top:2px}.who b{color:var(--sick)}
.free{font-weight:700;font-size:15px;color:var(--accent)}.free.neg{color:var(--danger)}
.steps ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px}.steps li.now{font-weight:700}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
.center{min-height:60vh;display:grid;place-items:center;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:14px}
.chip button{border:0;background:transparent;color:var(--danger);cursor:pointer;font-size:16px;line-height:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--danger-soft);padding:8px 12px;border-radius:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:560px){.cal{gap:3px}.day{min-height:84px;padding:4px}.day .meta{font-size:11px}h1{font-size:24px}}
</style>

<header class="top"><div class="in">
  <div class="brand">מילוי מקום</div>
  <div class="month"><button id="mPrev" aria-label="חודש קודם">›</button><b id="mLabel"></b><button id="mNext" aria-label="חודש הבא">‹</button></div>
  <div class="who" id="who"></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="app"><div class="center"><div><div class="spin"></div><p class="muted" style="margin-top:10px">מתחבר למערכת…</p></div></div></main>

<script>
// if anything breaks while loading, say so on screen instead of spinning forever
function showFatal(msg){const a=document.getElementById("app");if(!a)return;
  a.innerHTML='<div class="center"><div class="card" style="max-width:480px"><h2>המערכת לא נטענה</h2><p class="muted">צלמי את המסך הזה ושלחי למי שמתחזק את המערכת.</p><p dir="ltr" style="font-size:13px;word-break:break-word"></p><div class="row"><button class="btn primary" onclick="location.reload()">לנסות שוב</button></div></div></div>';
  a.querySelector("p[dir]").textContent=String(msg).slice(0,400)}
window.addEventListener("error",e=>{if(!window.__booted)showFatal(e.message||"script error")});
window.addEventListener("unhandledrejection",e=>{if(!window.__booted)showFatal(e.reason?.message||e.reason)});
setTimeout(()=>{if(!window.__booted)showFatal("timeout: "+(window.__stage||"start"))},20000);
</script>
<script>
"use strict";
const DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const S={db:null,session:null,profile:null,role:null,canEdit:false,isAdmin:false,auth:"login",authMsg:"",authOk:false,users:null,uid:null,allowed:false,school:{maxDaily:7,onlyTeachingDays:true},cal:{enabled:true,ranges:[]},teachers:[],
  month:null,md:null,view:"home",teacher:null,unsubMonth:null,sample:null,downloads:null,busy:{},review:null,confirm:null};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const clone=o=>JSON.parse(JSON.stringify(o??{}));
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3200)}
function curMonth(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function monthLabel(m){const[y,mm]=m.split("-");return MONTHS[+mm-1]+" "+y}
function shiftMonth(m,k){let[y,mm]=m.split("-").map(Number);mm+=k;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+"-"+pad(mm)}
function monthDays(m){const[y,mm]=m.split("-").map(Number);const n=new Date(y,mm,0).getDate();const out=[];
  for(let d=1;d<=n;d++){const wd=new Date(y,mm-1,d).getDay();out.push({date:m+"-"+pad(d),d,wd})}return out}
function fmtDate(iso){const[y,m,d]=iso.split("-");return +d+"."+(+m)}
const emptyMonth=()=>({quotaDays:{},reported:{},holidays:[],sick:{},subs:{},locked:{},targets:{}});
try{S.month=localStorage.getItem("mm.month")||curMonth()}catch(e){S.month=curMonth()}

/* ---------- writes: one at a time per document ---------- */
const queues={};
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const mine={};function remember(path,data){(mine[path]??=[]).push(stable(data));if(mine[path].length>30)mine[path].shift()}
function isOldOwnSave(path,data){const l=mine[path];if(!l||!l.length)return false;const j=stable(data);return l.includes(j)&&l[l.length-1]!==j}
function write(path,data){remember(path,data);if(!S.canEdit){toast("אין לך הרשאת עריכה");return Promise.resolve()}const p=(queues[path]||Promise.resolve()).then(()=>S.db.doc(path).set(data)).catch(e=>{
  toast("השמירה נכשלה. בדקי חיבור לאינטרנט ונסי שוב.");console.error(e)});
  queues[path]=p;return p}
const saveMonth=()=>write("months/"+S.month,S.md);
const saveTeachers=()=>write("school/teachers",{list:S.teachers});
const saveSchool=()=>write("school/config",S.school);
const saveCal=()=>write("school/calendar",S.cal);

/* ---------- capacity & planning ---------- */
function teacherById(id){return S.teachers.find(t=>t.id===id)}
function sched(t,wd){return wd>5?0:(+((t.hours||[])[wd])||0)}
function isSick(tid,date){return (S.md.sick[tid]||[]).includes(date)}
function subOf(tid,date){return +((S.md.subs[tid]||{})[date])||0}
function calHoliday(date){if(!S.cal.enabled)return null;const r=(S.cal.ranges||[]).find(r=>date>=r.from&&date<=(r.to||r.from));return r?r.name||"חופשה":null}
function holidayName(date){return S.md.holidays.includes(date)?"חופש":calHoliday(date)}
function dayOpen(day){return day.wd!==6&&!holidayName(day.date)}
function noSchedule(t){return !(t.hours||[]).some(h=>+h>0)}
function batches(){return S.md.batches||(S.md.batches=[])}
function sumH(b){let n=0;for(const d in b.h)n+=+b.h[d]||0;return n}
function syncReported(){const r={};for(const b of batches()){const x=r[b.tid]=r[b.tid]||{};for(const d in b.h)x[d]=(x[d]||0)+(+b.h[d]||0)}S.md.reported=r}
// older months kept one total per teacher: turn it into rounds once
function migrateBatches(md){if(md.batches)return;md.batches=[];const moe=md.moeLeft&&Object.keys(md.moeLeft).length,base=md.moeRepBase;
  for(const tid in (md.reported||{})){const rep=md.reported[tid]||{},shot={},rest={};
    for(const d in rep){const a=+rep[d]||0,inS=moe?Math.min(a,base?(+((base[tid]||{})[d])||0):a):0;if(inS)shot[d]=inS;if(a-inS)rest[d]=a-inS}
    if(Object.keys(shot).length)md.batches.push({id:uid(),tid,h:shot,at:"",inShot:true});
    if(Object.keys(rest).length)md.batches.push({id:uid(),tid,h:rest,at:"",inShot:false})}
  delete md.moeRepBase}
function reportTeacher(tid){const md=S.md,sub=md.subs[tid]||{},h={};let n=0;for(const d in sub)if(+sub[d]>0){h[d]=+sub[d];n+=+sub[d]}
  if(!n)return 0;batches().push({id:uid(),tid,h,at:new Date().toISOString().slice(0,10),inShot:false});
  delete md.subs[tid];if(md.locked)delete md.locked[tid];
  if(md.targets[tid]){const left=Math.max(0,+md.targets[tid]-n);if(left)md.targets[tid]=left;else delete md.targets[tid]}
  syncReported();return n}
// a rejected or cancelled round: its hours leave the reports and go back to "צריכה לקבל", to be placed again
function undoBatch(id){const md=S.md,b=batches().find(x=>x.id===id);if(!b)return 0;md.batches=batches().filter(x=>x!==b);
  const n=sumH(b);md.targets[b.tid]=(+md.targets[b.tid]||0)+n;syncReported();return n}
function repOf(tid,date){return +(((S.md.reported||{})[tid]||{})[date])||0}
function usedOf(tid,date){return subOf(tid,date)+repOf(tid,date)}
function teacherRep(tid){let n=0;for(const d in ((S.md.reported||{})[tid]||{}))n+=+S.md.reported[tid][d]||0;return n}
function totalRep(){let n=0;for(const t of S.teachers)n+=teacherRep(t.id);return n}
function freeLeft(t,day){return Math.max(0,capacity(t,day)-usedOf(t.id,day.date))}
function quotaLeft(date){return hasDayQuota()?Math.max(0,dayQuota(date)-daySubs(date)):Infinity}
function canGive(t,day){return Math.min(freeLeft(t,day),quotaLeft(day.date))}
function capacity(t,day){ // max substitution hours allowed that day
  if(!dayOpen(day)||isSick(t.id,day.date)||(t.noDays||[]).includes(day.wd)||day.date<((S.md.fromDate||{})[t.id]||""))return 0;
  const s=sched(t,day.wd),lim=dayLimit(day.wd);if(s===0)return Math.min(+S.school.freeMax||6,lim);
  return Math.max(0,lim-s)}
const DAYLEN=[5,6,6,6,6,4];
function dayLimit(wd){const l=(S.school.dayLen||DAYLEN)[wd];return Math.min(+S.school.maxDaily||7,+l>0?+l:DAYLEN[wd]??6)}
function totalSubs(){let n=0;for(const tid in S.md.subs)if(teacherById(tid))for(const d in S.md.subs[tid])n+=+S.md.subs[tid][d]||0;return n}
function teacherSubs(tid){let n=0;for(const d in (S.md.subs[tid]||{}))n+=+S.md.subs[tid][d]||0;return n}
function sickRelease(date){const wd=new Date(date+"T12:00:00").getDay();if(wd===6||holidayName(date))return 0;
  let n=0;for(const t of S.teachers)if(isSick(t.id,date))n+=sched(t,wd);return n}
function sickReleaseList(date){const wd=new Date(date+"T12:00:00").getDay();return S.teachers.filter(t=>isSick(t.id,date)&&sched(t,wd)>0).map(t=>({t,h:sched(t,wd)}))}
function hasMoe(){return !!S.md.moeLeft&&Object.keys(S.md.moeLeft).length>0}
function dayRep(date){let n=0;for(const t of S.teachers)n+=repOf(t.id,date);return n}
function hasDayQuota(){return hasMoe()||Object.values(S.md.sick||{}).some(a=>a.length)}
function isNewSick(tid,date){const b=S.md.moeSickBase;return !!b&&isSick(tid,date)&&!(b[tid]||[]).includes(date)}
function newSickList(date){const wd=new Date(date+"T12:00:00").getDay();if(wd===6||holidayName(date))return [];return S.teachers.filter(t=>isNewSick(t.id,date)&&sched(t,wd)>0).map(t=>({t,h:sched(t,wd)}))}
function newSickRelease(date){return newSickList(date).reduce((a,x)=>a+x.h,0)}
// hours of the rounds that the ministry screenshot already counts as used
function baseRep(date){let n=0;for(const b of batches())if(b.inShot)n+=+b.h[date]||0;return n}
function dayQuota(date){if(!hasDayQuota())return Infinity;if(hasMoe())return (+S.md.moeLeft[date]||0)+baseRep(date)+newSickRelease(date);return sickRelease(date)}
function quotaTotal(){if(!hasDayQuota())return 0;let n=0;for(const d of monthDays(S.month))if(d.wd!==6&&!holidayName(d.date))n+=dayQuota(d.date);return n}
function daySubs(date,exceptTid){let n=0;for(const t of S.teachers)if(t.id!==exceptTid)n+=usedOf(t.id,date);return n}
function problems(){const out=[];const days=monthDays(S.month);
  for(const t of S.teachers)for(const day of days){const h=usedOf(t.id,day.date);if(!h)continue;
    if(subOf(t.id,day.date)&&day.date<((S.md.fromDate||{})[t.id]||""))out.push(t.name+" · "+fmtDate(day.date)+": משובץ לפני "+fmtDate(S.md.fromDate[t.id])+", התאריך שממנו מותר לה");
    if(subOf(t.id,day.date)&&(t.noDays||[]).includes(day.wd))out.push(t.name+" · "+fmtDate(day.date)+": משובץ ביום "+DAYS[day.wd]+", שאסור לתת לה בו");
    if(isSick(t.id,day.date))out.push(t.name+" · "+fmtDate(day.date)+": מדווח מילוי מקום ביום מחלה");
    else if(!dayOpen(day))out.push(t.name+" · "+fmtDate(day.date)+": מדווח ביום שאין בו לימודים");
    else if(sched(t,day.wd)+h>dayLimit(day.wd))out.push(t.name+" · "+fmtDate(day.date)+": עובר "+dayLimit(day.wd)+" שעות לימוד ביום "+DAYS[day.wd]+" ("+sched(t,day.wd)+" במערכת + "+h+" מילוי)");}
  if(hasDayQuota())for(const day of days){const u=daySubs(day.date),q=dayQuota(day.date);if(u>q)out.push(fmtDate(day.date)+": שובצו "+u+" שעות אבל בתקן של היום יש רק "+q)}
  return out}
// choose a day: spread her hours, leave room on days other teachers depend on
function pickDay(days,cap,given,pool,demand){let best=null;for(const d of days){const c=cap[d.date];if(c<=0||pool[d.date]<=0)continue;
  const score=(given[d.date]||0)*100+(demand?demand[d.date]*3:0)-Math.min(pool[d.date],50)-c;if(!best||score<best.score)best={d,score}}return best&&best.d}
function monthCapacity(t){return monthDays(S.month).reduce((a,d)=>a+capacity(t,d),0)}
function keepLocked(t,d){return (S.md.locked[t.id]||{})[d.date]&&dayOpen(d)&&!isSick(t.id,d.date)&&!(t.noDays||[]).includes(d.wd)&&d.date>=((S.md.fromDate||{})[t.id]||"")}
function planTeacher(t){const md=S.md,days=monthDays(S.month).filter(dayOpen);const subs={},cap={},pool={};let have=0;
  for(const d of days){const h=keepLocked(t,d)?subOf(t.id,d.date):0;if(h){subs[d.date]=h;have+=h}
    const rp=repOf(t.id,d.date);cap[d.date]=Math.max(0,capacity(t,d)-h-rp);pool[d.date]=dayQuota(d.date)-daySubs(d.date,t.id)-h-rp}
  let need=Math.max(0,(+md.targets[t.id]||0)-have);const want=need;
  while(need>0){let best=null;for(const d of days){const blk=Math.min(need,cap[d.date],pool[d.date]);if(blk>0&&(!best||blk>best.blk))best={d,blk}}
    if(!best)break;subs[best.d.date]=(subs[best.d.date]||0)+best.blk;cap[best.d.date]-=best.blk;pool[best.d.date]-=best.blk;need-=best.blk}
  const byQuota=need>0&&days.some(d=>cap[d.date]>0);
  md.subs[t.id]=subs;if(!Object.keys(subs).length)delete md.subs[t.id];
  return {placed:want-need,missing:need,byQuota}}
function runPlan(){
  const md=S.md,days=monthDays(S.month).filter(dayOpen);
  const subs={},assigned={},cap={},pool={};
  for(const d of days)pool[d.date]=dayQuota(d.date);
  // keep hand-entered hours
  for(const t of S.teachers){subs[t.id]={};assigned[t.id]=0;cap[t.id]={};
    for(const day of days){const lockedH=keepLocked(t,day)?subOf(t.id,day.date):0;
      if(lockedH){subs[t.id][day.date]=lockedH;assigned[t.id]+=lockedH;pool[day.date]-=lockedH}
      const rp=repOf(t.id,day.date);pool[day.date]-=rp;
      cap[t.id][day.date]=Math.max(0,capacity(t,day)-lockedH-rp)}}
  const hasTargets=S.teachers.some(t=>+md.targets[t.id]>0);
  if(!hasTargets)return {left:0,short:[],none:true};
  const need=t=>hasTargets?Math.max(0,(+md.targets[t.id]||0)-assigned[t.id]):Infinity;
  const fair=t=>hasTargets?assigned[t.id]/(+md.targets[t.id]||1):assigned[t.id];
  const room=(t,d)=>Math.min(cap[t.id][d.date],pool[d.date]);
  if(!hasTargets){ // no hours entered: share the quota evenly, an hour at a time
    for(let guard=0;guard<20000;guard++){
      const cands=S.teachers.filter(t=>days.some(d=>room(t,d)>0));if(!cands.length)break;
      cands.sort((a,b)=>assigned[a.id]-assigned[b.id]||a.name.localeCompare(b.name,"he"));
      const t=cands[0];const d=pickDay(days,cap[t.id],subs[t.id],pool);
      subs[t.id][d.date]=(subs[t.id][d.date]||0)+1;cap[t.id][d.date]--;pool[d.date]--;assigned[t.id]++}
  }else{
    // whole days: give a teacher as many hours as fit on one day, so she comes in for a real block.
    // The teacher with the least room to spare goes first, and she takes the day the others need least.
    for(let guard=0;guard<5000;guard++){
      const cands=S.teachers.filter(t=>need(t)>0&&days.some(d=>room(t,d)>0));if(!cands.length)break;
      const spare=t=>days.reduce((a,d)=>a+room(t,d),0)-need(t);
      cands.sort((a,b)=>spare(a)-spare(b)||need(b)-need(a)||a.name.localeCompare(b.name,"he"));
      const t=cands[0],nd=need(t);let best=null;
      for(const d of days){const blk=Math.min(nd,room(t,d));if(blk<=0)continue;
        const others=cands.reduce((a,x)=>a+(x!==t?Math.min(need(x),room(x,d)):0),0);
        const score=blk*1000-others;if(!best||score>best.score)best={d,blk,score}}
      subs[t.id][best.d.date]=(subs[t.id][best.d.date]||0)+best.blk;cap[t.id][best.d.date]-=best.blk;pool[best.d.date]-=best.blk;assigned[t.id]+=best.blk}
  }
  for(const tid in subs)if(!Object.keys(subs[tid]).length)delete subs[tid];
  md.subs=subs;
  const left=hasDayQuota()?days.reduce((a,d)=>a+Math.max(0,pool[d.date]),0):0;
  const short=hasTargets?S.teachers.filter(t=>need(t)>0&&+md.targets[t.id]>0):[];
  return {left,short}}

const norm=s=>String(s||"").replace(/[֑-ׇ"'`׳״.,\-()]/g," ").replace(/\s+/g," ").trim().toLowerCase();
function matchTeacher(name){const n=norm(name);if(!n)return "";let t=S.teachers.find(t=>norm(t.name)===n);if(t)return t.id;
  const parts=n.split(" ");let best=null,bs=0;
  for(const t of S.teachers){const tp=norm(t.name).split(" ");const hit=parts.filter(p=>p.length>1&&tp.includes(p)).length;
    const sc=hit/Math.max(parts.length,tp.length);if(sc>bs){bs=sc;best=t}}
  return bs>=0.5?best.id:""}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

/* ---------- file reading ---------- */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]'))return res();
  const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.append(s)})}
async function xlsxText(file){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});return wb.SheetNames.map(n=>"### "+n+"\n"+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n")}
async function pdfParts(file){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let text="";const imgs=[];
  for(let i=1;i<=Math.min(pdf.numPages,12);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(x=>x.str).join(" ")+"\n";
    if(imgs.length<5){const vp=pg.getViewport({scale:1.6});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;imgs.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)))}}
  return text.replace(/\s/g,"").length>80?{text}:{images:imgs}}
// big files are read in parts, so no teacher is cut off
const CHUNK=24000;
function splitText(text,head){const out=[];let cur="";for(const line of text.split("\n")){if(cur.length+line.length>CHUNK&&cur.trim()){out.push(cur);cur=head?head+"\n":""}cur+=line+"\n"}if(cur.trim())out.push(cur);return out}
async function xlsxChunks(file){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});const out=[];let cur="";
  for(const n of wb.SheetNames){const t="### "+n+"\n"+XLSX.utils.sheet_to_csv(wb.Sheets[n]).replace(/,+$/gm,"");
    if(t.length>CHUNK){if(cur.trim())out.push(cur);cur="";out.push(...splitText(t,t.split("\n").slice(0,4).join("\n")));continue}
    if(cur.length+t.length>CHUNK&&cur.trim()){out.push(cur);cur=""}cur+=t+"\n\n"}
  if(cur.trim())out.push(cur);return out.map(text=>({text}))}
async function pdfChunks(file){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const n=Math.min(pdf.numPages,200);const texts=[];
  for(let i=1;i<=n;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();texts.push("--- עמוד "+i+" ---\n"+tc.items.map(x=>x.str).join(" "))}
  if(texts.join("").replace(/\s|-|עמוד|\d/g,"").length>40*n){const out=[];let cur="";
    for(const t of texts){if(cur.length+t.length>CHUNK&&cur){out.push({text:cur});cur=""}cur+=t+"\n"}if(cur)out.push({text:cur});return out}
  const lim=S.sample?await S.sample.limits().catch(()=>null):null;const per=Math.max(1,Math.min(4,lim?.images?.maxCount||4));const out=[];
  for(let i=1;i<=n;i+=per){const imgs=[];for(let j=i;j<Math.min(n+1,i+per);j++){const pg=await pdf.getPage(j);const vp=pg.getViewport({scale:1.6});
      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      imgs.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)))}out.push({images:imgs})}
  return out}
async function fileChunks(file){const n=file.name.toLowerCase();
  if(/\.(xlsx|xls|xlsm|ods)$/.test(n))return xlsxChunks(file);
  if(/\.(csv|txt|tsv)$/.test(n)){const t=await file.text();return splitText(t,t.split("\n")[0]).map(text=>({text}))}
  if(n.endsWith(".pdf")||file.type==="application/pdf")return pdfChunks(file);
  if(file.type.startsWith("image/"))return [{images:[file]}];
  throw new Error("סוג קובץ לא נתמך: "+file.name)}
async function fileParts(file){const ch=await fileChunks(file);const text=ch.filter(c=>c.text).map(c=>c.text).join("\n");return text?{text}:{images:ch[0].images}}
async function askAI(prompt,parts){
  if(!S.sample)throw new Error("קריאת קבצים חכמה לא זמינה כאן. אפשר להזין ידנית.");
  const opts={modelTier:"complex"};let input=prompt;
  if(parts.text)input+="\n\nתוכן הקובץ:\n"+parts.text.slice(0,180000);
  if(parts.images){opts.images=parts.images;input+="\n\nהקובץ מצורף כתמונה."}
  return S.sample.json(input,opts)}

function datesBetween(a,b){const out=[];let d=new Date(a+"T12:00:00");const e=new Date(b+"T12:00:00");let guard=0;
  while(d<=e&&guard++<120){out.push(d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()));d.setDate(d.getDate()+1)}return out}
async function addSick(tid,from,to){
  const byMonth={};for(const d of datesBetween(from,to)){(byMonth[d.slice(0,7)]??=[]).push(d)}
  for(const m in byMonth){
    let md;if(m===S.month)md=S.md;else{const snap=await S.db.doc("months/"+m).get();md=Object.assign(emptyMonth(),snap.exists?clone(snap.data()):{})}
    const set=new Set(md.sick[tid]||[]);byMonth[m].forEach(d=>set.add(d));md.sick[tid]=[...set].sort();
    // a sick day can't carry substitution hours
    for(const d of byMonth[m])if(md.subs[tid]&&md.subs[tid][d]){delete md.subs[tid][d];if(md.locked[tid])delete md.locked[tid][d]}
    await write("months/"+m,md)}}
async function applyReview(){const R=S.review;

      else{const t=teacherById(r.match);if(t)t.hours=r.hours}}
    S.teachers.sort((a,b)=>a.name.localeCompare(b.name,"he"));await saveTeachers();toast("מערכת השעות נשמרה")}
  if(R.kind==="sick"){let n=0;const per={};for(const r of R.rows){if(!r.match||r.match==="skip")continue;await addSick(r.match,r.from,r.to);n++;
      for(const d of datesBetween(r.from,r.to))per[d.slice(0,7)]=(per[d.slice(0,7)]||0)+1}
    // show the month the certificates belong to, not whatever month happened to be open
    const top=Object.keys(per).sort((a,b)=>per[b]-per[a])[0];
    if(top&&!per[S.month]){S.review=null;S.view="home";setMonth(top);toast(n+" אישורי מחלה נשמרו ב"+monthLabel(top)+". עברתי לחודש הזה.");return}
    toast(n+" אישורי מחלה נשמרו"+(Object.keys(per).length>1?" ("+Object.keys(per).sort().map(monthLabel).join(", ")+")":""))}
  if(R.kind==="quota"){let n=0,other=0;S.md.quotaDays=S.md.quotaDays||{};delete S.md.quotaParts;
    for(const r of R.rows){if(!r.date)continue;if(!r.date.startsWith(S.month)){other++;continue}if(+r.hours>0)S.md.quotaDays[r.date]=+r.hours;else delete S.md.quotaDays[r.date];n++}
    await saveMonth();toast("העדרות משחררת תקן עודכנו ל-"+n+" ימים"+(other?" ("+other+" תאריכים מחודש אחר לא נשמרו)":""));S.view="home"}
  if(R.kind==="moe"){const m={};let other=0;for(const r of R.rows){if(!r.date)continue;if(!r.date.startsWith(S.month)){other++;continue}m[r.date]=Math.max(0,+r.left||0)}

      S.md.moeLeft=m;S.md.moeSickBase=clone(S.md.sick);S.md.moeAt=new Date().toISOString().slice(0,10);syncReported();if(un)toast(un+" סבבים שלא נכללו בצילום הוחזרו ל״צריכה לקבל״");await saveMonth();toast("נשמר: מה שנשאר לפי משרד החינוך ב-"+Object.keys(m).length+" ימים. עכשיו לחצי ״תכנון אוטומטי״.")}S.view="home"}
  if(R.kind==="targets"){let n=0;for(const r of R.rows){if(!r.match||r.match==="skip")continue;if(+r.hours>0)S.md.targets[r.match]=+r.hours;else delete S.md.targets[r.match];n++}
    await saveMonth();toast("נשמרו שעות ל-"+n+" מורות");S.view="home"}
  if(R.kind==="calendar"){const rows=R.rows.filter(r=>r.from&&!r.skip);if(rows.length){S.cal.ranges=rows.map(({name,from,to})=>({name,from,to:to<from?from:to}));S.cal.enabled=true;await saveCal();toast("לוח החופשות עודכן: "+rows.length+" חופשות")}}
  S.review=null;render()}

function vAuth(){const m=S.auth,msg=S.authMsg?`<div class="note ${S.authOk?"ok":"bad"}">${esc(S.authMsg)}</div>`:"";

  const btn={login:"כניסה",signup:"הרשמה",forgot:"שליחת קישור לאיפוס",newpass:"שמירת הסיסמה"}[m];

  return `<div class="auth card"><h1>${head}</h1><p class="muted">מערכת לניהול שעות מילוי מקום.${m==="signup"?" אחרי ההרשמה מנהלת המערכת תאשר אותך.":""}</p>${msg}
  <form id="authForm" data-mode="${m}">${f}<button class="btn primary" type="submit" id="authBtn">${btn}</button></form><div class="row" style="justify-content:space-between">${links}</div></div>`}
const AUTH_ERR=e=>{const t=String(e?.message||e||"");
  if(/Invalid login/i.test(t))return "המייל או הסיסמה לא נכונים.";
  if(/not confirmed/i.test(t))return "צריך קודם לאשר את המייל: לחצי על הקישור שנשלח אלייך.";
  if(/already registered|already been registered/i.test(t))return "המייל הזה כבר רשום. נסי להיכנס או לאפס סיסמה.";
  if(/at least|weak|short/i.test(t))return "הסיסמה קצרה מדי. צריך לפחות 8 תווים.";
  if(/rate limit|security purposes/i.test(t))return "יותר מדי ניסיונות. חכי דקה ונסי שוב.";
  if(/fetch|network/i.test(t))return "אין חיבור לשרת. בדקי אינטרנט ונסי שוב.";
  return "משהו לא הצליח: "+t};
async function submitAuth(form){const m=form.dataset.mode,v=id=>(document.getElementById(id)?.value||"").trim();const btn=document.getElementById("authBtn");
  btn.disabled=true;S.authMsg="";S.authOk=false;const here=location.origin+location.pathname;
  try{
    if(m==="login"){const {error}=await sb.auth.signInWithPassword({email:v("aEmail"),password:document.getElementById("aPass").value});if(error)throw error}
    if(m==="signup"){const p=document.getElementById("aPass").value;if(p.length<8)throw new Error("short");
      const {data,error}=await sb.auth.signUp({email:v("aEmail"),password:p,options:{data:{full_name:v("aName")},emailRedirectTo:here}});if(error)throw error;
      if(!data.session){S.auth="login";S.authOk=true;S.authMsg="נשלח אלייך מייל אימות. לחצי על הקישור שבו, ואז היכנסי כאן."}}
    if(m==="forgot"){const {error}=await sb.auth.resetPasswordForEmail(v("aEmail"),{redirectTo:here});if(error)throw error;S.authOk=true;S.authMsg="אם המייל רשום, נשלח אליו קישור לאיפוס הסיסמה."}
    if(m==="newpass"){const p=document.getElementById("aPass").value;if(p.length<8)throw new Error("short");const {error}=await sb.auth.updateUser({password:p});if(error)throw error;
      S.auth="login";toast("הסיסמה עודכנה")}
  }catch(e){S.authMsg=AUTH_ERR(e)}
  render()}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.auth){S.auth=d.auth;S.authMsg="";render();return}
  if(d.tab){S.view=d.tab;S.confirm=null;render();window.scrollTo(0,0);if(d.tab==="users")loadUsers();return}
  if(d.teacher){S.teacher=d.teacher;S.view="teacher";S.confirm=null;render();window.scrollTo(0,0);return}
  if(d.sick){const tid=S.teacher;const set=new Set(S.md.sick[tid]||[]);if(set.has(d.sick))set.delete(d.sick);else{set.add(d.sick);
      if(S.md.subs[tid])delete S.md.subs[tid][d.sick];if(S.md.locked[tid])delete S.md.locked[tid][d.sick]}
    S.md.sick[tid]=[...set].sort();render();saveMonth();return}
  if(d.delrange!==undefined){S.cal.ranges=S.cal.ranges.filter((_,i)=>i!==+d.delrange);render();await saveCal();return}
  if(d.delhol){S.md.holidays=S.md.holidays.filter(x=>x!==d.delhol);render();saveMonth();return}
  if(d.day){S.day=d.day;render();return}
  switch(d.act){
    case "day-add":case "day-sub":{const tid=d.id,date=S.day,t=teacherById(tid),day=monthDays(S.month).find(x=>x.date===date);if(!t||!day)return;
      const v=subOf(tid,date)+(d.act==="day-add"?1:-1);
      if(d.act==="day-add"&&(freeLeft(t,day)<=0||(hasDayQuota()&&dayQuota(date)-daySubs(date)<=0)))return toast("אין מקום ביום הזה");
      S.md.subs[tid]=S.md.subs[tid]||{};S.md.locked[tid]=S.md.locked[tid]||{};
      if(v>0){S.md.subs[tid][date]=v;S.md.locked[tid][date]=true}else{delete S.md.subs[tid][date];delete S.md.locked[tid][date]}
      render();await saveMonth();return}
    case "logout":await sb.auth.signOut();return;
    case "recheck":await loadProfile();render();return;
    case "users-refresh":S.users=null;render();await loadUsers();return;
    case "copy-link":return copyText(location.origin+location.pathname);
    case "plan-one":{const t=teacherById(S.teacher);const r=planTeacher(t);render();await saveMonth();
      toast(r.missing?(r.byQuota?"שובצו "+r.placed+". אין מספיק תקן בימים הפנויים שלה, חסרות "+r.missing:"שובצו "+r.placed+". אין מספיק ימים פנויים, חסרות "+r.missing):"שובצו "+r.placed+" שעות");return}
    case "plan":if(Object.keys(S.md.subs).length&&S.confirm!=="replan"){S.confirm="replan";render();return}
    case "plan-yes":{S.confirm=null;if(!S.teachers.some(t=>+S.md.targets[t.id]>0)){toast("אין אף מורה עם מספר ב״צריכה לקבל״, ולכן אין מה לשבץ. ממלאים קודם כמה שעות כל מורה צריכה.");render();return}
      const r=runPlan();render();await saveMonth();
      toast(r.short.length?"שובץ. ל-"+r.short.length+" מורות אין מספיק ימים פנויים ליעד":r.left>0?"שובץ. נשארו "+r.left+" שעות בתקן בימים שאין בהם מורה פנויה":"התכנון הושלם");return}
    case "cancel":S.confirm=null;render();return;
    case "export":return exportExcel();
    case "add-teacher":{const el=document.getElementById("newName");const n=el.value.trim();if(!n)return;S.teachers.push({id:uid(),name:n,hours:[0,0,0,0,0,0]});
      S.teachers.sort((a,b)=>a.name.localeCompare(b.name,"he"));render();await saveTeachers();toast("נוספה "+n);return}

    async get(){const {data,error}=await sb.from("app_docs").select("data").eq("path",path).maybeSingle();if(error)throw error;return snap(data?data.data:null)},
    async set(d){const {error}=await sb.from("app_docs").upsert({path,data:d,updated_at:new Date().toISOString(),updated_by:S.uid,client:CLIENT});if(error)throw error},
    onSnapshot(fn,err){(listeners[path]??=[]).push(fn);this.get().then(fn,e=>{console.error(e);err&&err(e)});return()=>{listeners[path]=(listeners[path]||[]).filter(x=>x!==fn)}}}}}}

async function prepImage(blob){ // shrink big photos so uploads stay small
  try{const bmp=await createImageBitmap(blob);const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    if(k<1||blob.size>1500000||!/^image\/(png|jpeg|webp|gif)$/.test(blob.type)){const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
      c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85))}}catch(e){}
  const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob)});
  return {type:blob.type||"image/jpeg",data}}
function parseLoose(t){t=String(t||"").trim();try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const i=t.search(/[\[{]/),j=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));if(i>=0&&j>i){try{return JSON.parse(t.slice(i,j+1))}catch(e){}}
  throw {code:"invalid_json",message:"bad answer"}}

  async json(input,opts={}){const images=[];for(const b of [].concat(opts.images?[...opts.images]:[]))images.push(await prepImage(b));

    if(error){let code="api_error";try{code=(await error.context.json()).error||code}catch(e){}throw {code,message:String(error.message||code)}}
